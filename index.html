async function profile(u){UID=u.id;const d=ck(await sb.from('profiles').select('empresa,trial_ends_at,plano_status,is_admin,pago_ate').eq('id',u.id).single());
 const ok=d.is_admin||(d.plano_status==='ativo'&&d.pago_ate>=today())||(d.plano_status==='teste'&&new Date(d.trial_ends_at)>new Date());
 return{id:u.id,email:u.email,nome:d.empresa,trialEndsAt:(d.trial_ends_at||'').slice(0,10),pagoAte:d.pago_ate,plano:d.plano_status,isAdmin:d.is_admin,acessoOk:ok}}
/* clientes "Variável": o total pago é um único lançamento em `pagamentos` (o trigger do banco recalcula clientes.pago) */
async function setPago(id,novo,atual){
 if(novo>atual){ck(await sb.from('pagamentos').insert({owner_id:UID,cliente_id:id,valor:novo-atual,pago_em:today(),observacao:'Lançamento manual'}));return}
 ck(await sb.from('pagamentos').delete().eq('cliente_id',id).is('venc_anterior',null));
 if(novo>0)ck(await sb.from('pagamentos').insert({owner_id:UID,cliente_id:id,valor:novo,pago_em:today(),observacao:'Lançamento manual (ajuste)'}))}
const api={
 auth:{
  async signIn(email,password){const{data,error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw new Error(error.message==='Invalid login credentials'?'E-mail ou senha inválidos.':error.message==='Email not confirmed'?'Confirme seu e-mail antes de entrar.':error.message);return profile(data.user)},
  async signUp(nome,email,password){if(!nome)throw new Error('Informe o nome da empresa.');
   const{data,error}=await sb.auth.signUp({email,password,options:{data:{empresa:nome}}});if(error)throw new Error(error.message);
   if(!data.session)throw new Error('CONFIRM');return profile(data.user)},
  async session(){const{data}=await sb.auth.getSession();return data.session?profile(data.session.user):null},
  async signOut(){await sb.auth.signOut();UID=null}},
 clients:{
  async list(){
   const[c,p]=await Promise.all([
    sb.from('clientes').select('*').eq('owner_id',UID).order('created_at',{ascending:false}),
    sb.from('pagamentos').select('id,cliente_id,valor,pago_em,venc_anterior').eq('owner_id',UID).order('pago_em').order('id')]);
   const h={},u={};ck(p).forEach(x=>{u[x.cliente_id]=x.pago_em;if(x.venc_anterior)(h[x.cliente_id]=h[x.cliente_id]||[]).push({valor:Number(x.valor),venc:x.venc_anterior,data:x.pago_em})});
   return ck(c).map(r=>({...fromRow(r),historico:h[r.id]||[],ultimoPag:u[r.id]||null}))},
  async create(c){const r=ck(await sb.from('clientes').insert({...toRow(c),pago:0,owner_id:UID}).select().single());
   if(c.tipo!=='Fixo'&&c.pago>0)await setPago(r.id,c.pago,0);return r},
  async update(id,c){const cur=ck(await sb.from('clientes').select('pago').eq('id',id).single());
   ck(await sb.from('clientes').update(toRow(c)).eq('id',id));
   if(c.tipo!=='Fixo'&&Number(cur.pago)!==c.pago)await setPago(id,c.pago,Number(cur.pago))},
  async remove(id){ck(await sb.from('clientes').delete().eq('id',id))},
  async registerPayment(id){ck(await sb.rpc('registrar_pagamento_fixo',{p_cliente:id,p_data:today()}))},
  async undoPayment(id){ck(await sb.rpc('desfazer_pagamento_fixo',{p_cliente:id}))}},
 admin:{
  async list(){return ck(await sb.from('admin_assinantes').select('*').order('created_at',{ascending:false}))},
  async liberar(id){ck(await sb.rpc('admin_liberar_30_dias',{p_user:id}))},
  async bloquear(id){ck(await sb.rpc('admin_bloquear',{p_user:id}))},
  async estenderTeste(id,dias){ck(await sb.rpc('admin_estender_teste',{p_user:id,p_dias:dias}))}}};

/* ========== comprovantes ========== */
function printReceipt(c,kind,empresa){
 const pay=kind==='pagamento',fx=c.tipo==='Fixo',last=(c.historico||[]).slice(-1)[0],val=pay?(fx?(last?last.valor:0):c.pago):saldoOf(c);
 const w=window.open('','_blank');if(!w){alert('Permita pop-ups para imprimir.');return}
 w.document.write(`<html><head><title>Comprovante</title><style>body{font-family:Arial;max-width:420px;margin:30px auto;color:#111}h1{font-size:24px;text-align:center;margin:8px 0 2px}.top{text-align:center;border-bottom:2px solid #b8932a;padding-bottom:12px;margin-bottom:10px}.top img{width:48px;height:48px;border-radius:8px}.top small{display:block;font-size:13px;color:#555;font-weight:normal;letter-spacing:1px;text-transform:uppercase}td{padding:6px 0}.v{text-align:right;font-weight:bold}</style></head><body>
 <div class="top"><img src="${LOGO}" alt=""><h1>${empresa}</h1><small>Comprovante de ${pay?'Pagamento':'Débito'}</small></div>
 <table width="100%"><tr><td>Cliente</td><td class="v">${c.nome}</td></tr><tr><td>Contato</td><td class="v">${c.contato}</td></tr>${c.documento?`<tr><td>CPF/CNPJ</td><td class="v">${c.documento}</td></tr>`:''}
 <tr><td>Data inicial</td><td class="v">${fmt(c.dataInicial)}</td></tr><tr><td>Vencimento</td><td class="v">${fmt(c.vencimento)}</td></tr>
 <tr><td>${fx?'Valor mensal':'Valor total'}</td><td class="v">${brl(c.valor)}</td></tr><tr><td>${pay?(fx?'Último pagamento':'Total pago'):'Saldo em aberto'}</td><td class="v">${brl(val)}</td></tr>${pay&&c.ultimoPag?`<tr><td>Data do último pagamento</td><td class="v">${fmt(c.ultimoPag)}</td></tr>`:''}</table>
 <p style="text-align:center;margin-top:30px;font-size:12px">Emitido em ${new Date().toLocaleString('pt-BR')}<br>Sistema Rina Soluções</p><script>window.print()<\/script></body></html>`);
 w.document.close();
}

/* ========== UI base ========== */
const inp='w-full rounded-lg bg-navy-950 border border-navy-700 px-3 py-2.5 text-sm focus:outline-none focus:border-gold-500';
const Field=({label,children})=><label className="block"><span className="text-xs text-slate-400 mb-1 block">{label}</span>{children}</label>;
const Modal=({title,onClose,children})=>(
 <div className="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
  <div className="bg-navy-900 border border-gold-600/40 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5" onClick={e=>e.stopPropagation()}>
   <div className="flex justify-between items-center mb-4"><h3 className="font-bold gold-text text-lg">{title}</h3><button onClick={onClose} className="text-slate-400 text-2xl leading-none">×</button></div>{children}</div></div>);

/* ========== Tela 1: Login / Cadastro / Termos ========== */
function Login({onAuth}){
 const [mode,setMode]=useState('login');const [f,setF]=useState({nome:'',email:'',senha:''});
 const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [terms,setTerms]=useState(false);const [ok,setOk]=useState(false);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const submit=async e=>{e.preventDefault();setErr('');
  if(mode==='signup'&&!ok){setErr('Aceite os Termos para continuar.');return}
  setBusy(true);try{onAuth(mode==='login'?await api.auth.signIn(f.email,f.senha):await api.auth.signUp(f.nome,f.email,f.senha))}catch(x){if(x.message==='CONFIRM'){setMode('login');setErr('Conta criada! Enviamos um e-mail de confirmação. Confirme e depois entre.')}else setErr(x.message)}setBusy(false)};
 return(
 <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-navy-900 to-navy-950">
  <div className="w-full max-w-md">
   <img src={LOGO} alt="Rina Soluções" className="w-40 h-40 sm:w-48 sm:h-48 object-contain mx-auto rounded-2xl"/>
   <div className="bg-navy-900/80 border border-gold-600/30 rounded-2xl p-6 mt-4 shadow-2xl">
    <div className="grid grid-cols-2 bg-navy-950 rounded-lg p-1 mb-5">
     {[['login','Entrar'],['signup','Criar conta']].map(([m,t])=><button key={m} onClick={()=>{setMode(m);setErr('')}} className={'py-2 rounded-md text-sm font-semibold '+(mode===m?'btn-gold':'text-slate-400')}>{t}</button>)}</div>
    {mode==='signup'&&<div className="mb-4 rounded-lg border border-gold-500/40 bg-gold-500/10 p-3 text-sm text-gold-300">🎁 <b>15 dias grátis</b>, depois apenas <b>R$ 21,00/mês</b>. Sem fidelidade.</div>}
    <form onSubmit={submit} className="space-y-3">
     {mode==='signup'&&<Field label="Nome / Empresa"><input className={inp} value={f.nome} onChange={set('nome')}/></Field>}
     <Field label="E-mail"><input type="email" className={inp} value={f.email} onChange={set('email')} autoComplete="email"/></Field>
     <Field label="Senha"><input type="password" className={inp} value={f.senha} onChange={set('senha')} autoComplete={mode==='login'?'current-password':'new-password'}/></Field>
     {mode==='signup'&&<label className="flex gap-2 text-xs text-slate-300"><input type="checkbox" checked={ok} onChange={e=>setOk(e.target.checked)} className="mt-0.5 accent-yellow-500"/><span>Li e aceito os <button type="button" onClick={()=>setTerms(true)} className="text-gold-400 underline">Termos de Responsabilidade e Privacidade</button>.</span></label>}
     {err&&<p className={'text-sm '+(err.startsWith('Conta criada')?'text-gold-300':'text-red-400')}>{err}</p>}
     <button disabled={busy} className="btn-gold w-full rounded-lg py-3 disabled:opacity-60">{busy?'Aguarde…':mode==='login'?'Entrar':'Começar teste grátis'}</button>
    </form>
    
    <p className="text-center text-xs mt-3"><button onClick={()=>setTerms(true)} className="text-gold-400 underline">Termos de Responsabilidade e Privacidade</button></p>
   </div>
  </div>
  {terms&&<Modal title="Termos de Responsabilidade e Privacidade" onClose={()=>setTerms(false)}>
   <div className="text-sm text-slate-300 space-y-3">
    <p><b className="text-gold-300">1. Responsabilidade.</b> A plataforma é uma ferramenta de organização. Os dados dos seus clientes e a veracidade dos lançamentos são de sua responsabilidade.</p>
    <p><b className="text-gold-300">2. Privacidade (LGPD).</b> Os dados são usados apenas para operar o serviço e não são vendidos a terceiros.</p>
    <p><b className="text-gold-300">3. Plano.</b> 15 dias grátis; depois R$ 21,00/mês, com cancelamento a qualquer momento.</p>
    <p className="text-xs text-slate-500">Texto provisório — substituir pelo jurídico final.</p></div></Modal>}
 </div>);
}

/* ========== Tela 2: Dashboard (reutilizável p/ Tela 3) ========== */
const Stat=({label,value,sub,tone})=>(
 <div className="rounded-xl bg-navy-900 border border-navy-700 p-4"><p className="text-xs text-slate-400">{label}</p>
  <p className={'text-xl sm:text-2xl font-bold mt-1 '+(tone||'gold-text')}>{value}</p>{sub&&<p className="text-xs text-slate-500 mt-0.5">{sub}</p>}</div>);

const empty={nome:'',contato:'',documento:'',historico:[],dataInicial:iso(0),vencimento:iso(30),valor:'',pago:0,tipo:'Fixo'};
function ClientForm({initial,onSave,onClose}){
 const [f,setF]=useState(initial||empty);const [err,setErr]=useState('');const set=k=>e=>setF({...f,[k]:e.target.value});
 const save=e=>{e.preventDefault();if(!f.nome||!f.valor)return;if(!validDoc(f.documento)){setErr('CPF ou CNPJ inválido. Confira os números.');return}onSave({...f,valor:+f.valor,pago:+f.pago||0})};
 return(<form onSubmit={save} className="space-y-3">
  <Field label="Nome"><input className={inp} value={f.nome} onChange={set('nome')} required/></Field>
  <Field label="Dados de contato"><input className={inp} value={f.contato} onChange={set('contato')} placeholder="Telefone ou e-mail"/></Field>
  <Field label="CPF ou CNPJ (opcional)"><input className={inp} inputMode="numeric" value={f.documento||''} onChange={e=>{setErr('');setF({...f,documento:maskDoc(e.target.value)})}} placeholder="000.000.000-00 ou 00.000.000/0000-00"/></Field>
  <div className="grid grid-cols-2 gap-3">
   <Field label="Data inicial"><input type="date" className={inp} value={f.dataInicial} onChange={set('dataInicial')}/></Field>
   <Field label="Vencimento"><input type="date" className={inp} value={f.vencimento} onChange={set('vencimento')}/></Field>
   <Field label={f.tipo==='Fixo'?'Valor mensal (R$)':'Valor (R$)'}><input type="number" step="0.01" min="0" className={inp} value={f.valor} onChange={set('valor')} required/></Field>
   {f.tipo!=='Fixo'&&<Field label="Já pago (R$)"><input type="number" step="0.01" min="0" className={inp} value={f.pago} onChange={set('pago')}/></Field>}</div>
  <Field label="Tipo"><select className={inp} value={f.tipo} onChange={set('tipo')}><option>Fixo</option><option>Variável</option></select></Field>
  {err&&<p className="text-red-400 text-sm">{err}</p>}
  <div className="flex gap-2 pt-2"><button type="button" onClick={onClose} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button className="flex-1 btn-gold rounded-lg py-2.5">Salvar</button></div></form>);
}

function ClientsPanel({title,user,onLogout,extra}){
 const [list,setList]=useState([]);const [loading,setLoading]=useState(true);const [msg,setMsg]=useState('');
 const [q,setQ]=useState('');const [flt,setFlt]=useState('todos');const [modal,setModal]=useState(null);
 const run=async fn=>{try{await fn();setMsg('')}catch(e){const m=e.message||'';setMsg(/row-level security/i.test(m)?'Sua assinatura não está ativa (teste encerrado ou plano pendente). Você ainda pode consultar os dados.':(m||'Erro inesperado'));setLoading(false)}};
 const fetchList=async()=>{setList(await api.clients.list());setLoading(false)};
 const load=()=>run(fetchList);
 useEffect(()=>{load()},[]);
 const stats=useMemo(()=>{
  const open=list.filter(c=>statusOf(c)!=='quitado'),late=list.filter(c=>statusOf(c)==='atrasado'),paid=list.filter(c=>statusOf(c)==='quitado');
  const sum=a=>a.reduce((s,c)=>s+saldoOf(c),0);
  return{receber:sum(open),atrasados:sum(late),quitados:list.filter(c=>statusOf(c)==='quitado').reduce((s,c)=>s+c.valor,0),total:list.length,nLate:late.length}},[list]);
 const shown=list.filter(c=>(flt==='todos'||statusOf(c)===flt)&&c.nome.toLowerCase().includes(q.toLowerCase()));
 const save=d=>run(async()=>{modal.client?await api.clients.update(modal.client.id,d):await api.clients.create(d);setModal(null);await fetchList()});
 const del=()=>run(async()=>{await api.clients.remove(modal.client.id);setModal(null);await fetchList()});
 const doPay=()=>run(async()=>{await api.clients.registerPayment(modal.client.id);setModal(null);await fetchList()});
 const undo=c=>run(async()=>{await api.clients.undoPayment(c.id);await fetchList()});
 const Actions=({c})=>(<div className="flex flex-wrap gap-1.5">
  {c.tipo==='Fixo'&&<button onClick={()=>setModal({type:'pay',client:c})} className="px-2.5 py-1.5 rounded-md bg-emerald-500/20 text-emerald-300 text-xs font-semibold">✅ Pagamento feito</button>}
  {c.tipo==='Fixo'&&(c.historico||[]).length>0&&<button onClick={()=>undo(c)} className="px-2.5 py-1.5 rounded-md bg-amber-500/15 text-amber-300 text-xs">↩ Desfazer</button>}
  <button onClick={()=>setModal({type:'edit',client:c})} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">✏️ Editar</button>
  <button onClick={()=>printReceipt(c,'pagamento',user.nome)} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">🧾 Pagamento</button>
  <button onClick={()=>printReceipt(c,'debito',user.nome)} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">📄 Débito</button>
  <button onClick={()=>setModal({type:'del',client:c})} className="px-2.5 py-1.5 rounded-md bg-red-500/15 text-red-300 text-xs">🗑 Excluir</button></div>);
 const Badge=({c})=>{const[t,cl]=ST[statusOf(c)];return<span className={'px-2 py-0.5 rounded-full text-xs font-semibold '+cl}>{t}</span>};
 return(
 <div className="min-h-screen bg-navy-950">
  <header className="sticky top-0 z-30 bg-navy-900/95 backdrop-blur border-b border-gold-600/30">
   <div className="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
    <img src={LOGO} alt="" className="w-10 h-10 rounded-lg object-cover"/>
    <div className="flex-1 min-w-0"><p className="font-bold gold-text leading-tight truncate">Rina Soluções</p><p className="text-xs text-slate-400 truncate">{user.nome} · {user.isAdmin?'ADM Master':user.plano==='ativo'?'ativo até '+fmt(user.pagoAte):'teste até '+fmt(user.trialEndsAt)}</p></div>
    {extra}<button onClick={onLogout} className="text-sm text-slate-300 border border-navy-700 rounded-lg px-3 py-1.5">Sair</button></div></header>
  <main className="max-w-6xl mx-auto p-4 space-y-5">
   {!user.acessoOk&&<div className="rounded-lg bg-gold-500/10 border border-gold-500/40 text-gold-300 text-sm p-3">Seu acesso está vencido: você pode consultar os dados, mas não editar. Entre em contato com a Rina Soluções para renovar.</div>}
   {msg&&<div className="rounded-lg bg-red-500/15 border border-red-500/40 text-red-200 text-sm p-3">{msg}</div>}
   <div className="flex items-center justify-between gap-3"><h1 className="text-xl font-bold">{title}</h1>
    <button onClick={()=>setModal({type:'edit'})} className="btn-gold rounded-lg px-4 py-2 text-sm">+ Novo Cliente</button></div>
   <section className="grid grid-cols-2 lg:grid-cols-5 gap-3">
    <Stat label="Total a Receber" value={brl(stats.receber)}/>
    <Stat label="Soma dos Atrasados" value={brl(stats.atrasados)} tone="text-red-300"/>
    <Stat label="Soma dos Quitados" value={brl(stats.quitados)} tone="text-emerald-300"/>
    <Stat label="Total de Clientes" value={stats.total}/>
    <Stat label="Clientes Atrasados" value={`${stats.nLate} / ${stats.total}`} sub="atrasados / total" tone="text-red-300"/></section>
   <div className="flex flex-col sm:flex-row gap-2">
    <input className={inp+' sm:max-w-xs'} placeholder="🔍 Buscar cliente…" value={q} onChange={e=>setQ(e.target.value)}/>
    <div className="flex gap-1.5 overflow-x-auto">{[['todos','Todos'],['em_dia','Em dia'],['atrasado','Atrasados'],['quitado','Quitados']].map(([k,t])=>
     <button key={k} onClick={()=>setFlt(k)} className={'px-3 py-2 rounded-lg text-sm whitespace-nowrap '+(flt===k?'btn-gold':'bg-navy-900 text-slate-300 border border-navy-700')}>{t}</button>)}</div></div>
   {loading?<p className="text-slate-400">Carregando…</p>:shown.length===0?<p className="text-slate-400 text-center py-10">Nenhum cliente encontrado.</p>:<>
    <div className="hidden md:block rounded-xl border border-navy-700 overflow-x-auto">
     <table className="w-full text-sm"><thead className="bg-navy-900 text-slate-400 text-left"><tr>{['Cliente','Início','Vencimento','Valor','Pago','Saldo','Tipo','Status','Ações'].map(h=><th key={h} className="px-3 py-3 font-medium whitespace-nowrap">{h}</th>)}</tr></thead>
      <tbody>{shown.map(c=><tr key={c.id} className="border-t border-navy-700 hover:bg-navy-900/60">
       <td className="px-3 py-3"><p className="font-semibold">{c.nome}</p><p className="text-xs text-slate-400">{c.contato}</p>{c.documento&&<p className="text-xs text-slate-500">{c.documento}</p>}</td>
       <td className="px-3 py-3 whitespace-nowrap">{fmt(c.dataInicial)}</td><td className="px-3 py-3 whitespace-nowrap">{fmt(c.vencimento)}</td>
       <td className="px-3 py-3 whitespace-nowrap">{brl(c.valor)}</td><td className="px-3 py-3 whitespace-nowrap">{brl(c.pago)}{c.ultimoPag&&<p className="text-xs text-slate-500">último: {fmt(c.ultimoPag)}</p>}</td>
       <td className="px-3 py-3 whitespace-nowrap font-semibold text-gold-300">{brl(saldoOf(c))}</td><td className="px-3 py-3">{c.tipo}</td>
       <td className="px-3 py-3"><Badge c={c}/></td><td className="px-3 py-3"><Actions c={c}/></td></tr>)}</tbody></table></div>
    <div className="md:hidden space-y-3">{shown.map(c=><div key={c.id} className="rounded-xl bg-navy-900 border border-navy-700 p-4 space-y-2">
     <div className="flex justify-between items-start gap-2"><div><p className="font-semibold">{c.nome}</p><p className="text-xs text-slate-400">{c.contato}</p>{c.documento&&<p className="text-xs text-slate-500">{c.documento}</p>}</div><Badge c={c}/></div>
     <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-sm">
      <span className="text-slate-400">Início</span><span className="text-right">{fmt(c.dataInicial)}</span>
      <span className="text-slate-400">Vencimento</span><span className="text-right">{fmt(c.vencimento)}</span>
      <span className="text-slate-400">Valor</span><span className="text-right">{brl(c.valor)}</span>
      <span className="text-slate-400">Pago</span><span className="text-right">{brl(c.pago)}</span>
      <span className="text-slate-400">Últ. pagamento</span><span className="text-right">{fmt(c.ultimoPag)}</span>
      <span className="text-slate-400">Saldo</span><span className="text-right font-bold text-gold-300">{brl(saldoOf(c))}</span>
      <span className="text-slate-400">Tipo</span><span className="text-right">{c.tipo}</span></div><Actions c={c}/></div>)}</div></>}
  </main>
  {modal?.type==='edit'&&<Modal title={modal.client?'Editar Cliente':'Novo Cliente'} onClose={()=>setModal(null)}><ClientForm initial={modal.client} onSave={save} onClose={()=>setModal(null)}/></Modal>}
  {modal?.type==='pay'&&<Modal title="Confirmar pagamento" onClose={()=>setModal(null)}>
   <p className="text-sm mb-1"><b>{modal.client.nome}</b></p>
   <p className="text-sm text-slate-300">Valor mensal: <b className="text-gold-300">{brl(modal.client.valor)}</b></p>
   <p className="text-sm text-slate-300 mb-4">Vencimento: {fmt(modal.client.vencimento)} → <b className="text-gold-300">{fmt(addMonths(modal.client.vencimento,1))}</b></p>
   <div className="flex gap-2"><button onClick={()=>setModal(null)} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button onClick={doPay} className="flex-1 btn-gold rounded-lg py-2.5">Confirmar pagamento</button></div></Modal>}
  {modal?.type==='del'&&<Modal title="Excluir cliente" onClose={()=>setModal(null)}><p className="text-sm mb-4">Excluir <b>{modal.client.nome}</b>? Esta ação não pode ser desfeita.</p>
   <div className="flex gap-2"><button onClick={()=>setModal(null)} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button onClick={del} className="flex-1 rounded-lg bg-red-600 py-2.5 font-semibold">Excluir</button></div></Modal>}
 </div>);
}

const SIT={ativo:['Ativo','bg-emerald-500/15 text-emerald-300'],teste:['Em teste','bg-gold-500/15 text-gold-300'],vencido:['Vencido','bg-red-500/15 text-red-300'],teste_encerrado:['Teste encerrado','bg-red-500/15 text-red-300'],inadimplente:['Bloqueado','bg-red-500/15 text-red-300'],cancelado:['Cancelado','bg-slate-500/20 text-slate-300']};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmtD=s=>s?fmt(String(s).slice(0,10)):'—';
function AdminPanel({user,onLogout,extra}){
 const [rows,setRows]=useState([]);const [loading,setLoading]=useState(true);const [q,setQ]=useState('');const [modal,setModal]=useState(null);const [msg,setMsg]=useState('');
 const fetchRows=async()=>{setRows(await api.admin.list());setLoading(false)};
 const run=async fn=>{try{await fn();setMsg('')}catch(e){setMsg(e.message||'Erro inesperado');setLoading(false)}};
 useEffect(()=>{run(fetchRows)},[]);
 const act=fn=>run(async()=>{await fn();setModal(null);await fetchRows()});
 const shown=rows.filter(r=>((r.empresa||'')+' '+(r.email||'')).toLowerCase().includes(q.toLowerCase()));
 const n=k=>rows.filter(r=>r.situacao===k).length;
 const bloq=rows.filter(r=>['vencido','teste_encerrado','inadimplente','cancelado'].includes(r.situacao)).length;
 const novoAte=r=>addDays(r.pago_ate&&r.pago_ate>today()?r.pago_ate:today(),30);
 const Badge=({r})=>{const[t,c]=SIT[r.situacao]||[r.situacao,'bg-slate-500/20 text-slate-300'];return<span className={'px-2 py-0.5 rounded-full text-xs font-semibold '+c}>{t}</span>};
 const ate=r=>r.situacao==='teste'||r.situacao==='teste_encerrado'?'Teste até '+fmtD(r.trial_ends_at):'Pago até '+fmtD(r.pago_ate);
 const Acts=({r})=>(<div className="flex flex-wrap gap-1.5">
  <button onClick={()=>setModal({type:'lib',r})} className="px-2.5 py-1.5 rounded-md bg-emerald-500/20 text-emerald-300 text-xs font-semibold">✅ Liberar 30 dias</button>
  <button onClick={()=>act(()=>api.admin.estenderTeste(r.id,15))} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">+15 dias de teste</button>
  <button onClick={()=>setModal({type:'blq',r})} className="px-2.5 py-1.5 rounded-md bg-red-500/15 text-red-300 text-xs">⛔ Bloquear</button></div>);
 return(
 <div className="min-h-screen bg-navy-950">
  <header className="sticky top-0 z-30 bg-navy-900/95 backdrop-blur border-b border-gold-600/30"><div className="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
   <img src={LOGO} alt="" className="w-10 h-10 rounded-lg object-cover"/>
   <div className="flex-1 min-w-0"><p className="font-bold gold-text leading-tight truncate">Painel ADM Master</p><p className="text-xs text-slate-400 truncate">{user.email}</p></div>
   {extra}<button onClick={onLogout} className="text-sm text-slate-300 border border-navy-700 rounded-lg px-3 py-1.5">Sair</button></div></header>
  <main className="max-w-6xl mx-auto p-4 space-y-5">
   <h1 className="text-xl font-bold">Assinantes</h1>
   {msg&&<div className="rounded-lg bg-red-500/15 border border-red-500/40 text-red-200 text-sm p-3">{msg}</div>}
   <section className="grid grid-cols-2 lg:grid-cols-5 gap-3">
    <Stat label="Total de assinantes" value={rows.length}/>
    <Stat label="Ativos" value={n('ativo')} tone="text-emerald-300"/>
    <Stat label="Em teste" value={n('teste')}/>
    <Stat label="Vencidos / bloqueados" value={bloq} tone="text-red-300"/>
    <Stat label="Receita mensal estimada" value={brl(n('ativo')*21)} sub="ativos × R$ 21,00"/></section>
   <input className={inp+' sm:max-w-xs'} placeholder="🔍 Buscar empresa ou e-mail…" value={q} onChange={e=>setQ(e.target.value)}/>
   {loading?<p className="text-slate-400">Carregando…</p>:shown.length===0?<p className="text-slate-400 text-center py-10">Nenhum assinante encontrado.</p>:<>
    <div className="hidden md:block rounded-xl border border-navy-700 overflow-x-auto">
     <table className="w-full text-sm"><thead className="bg-navy-900 text-slate-400 text-left"><tr>{['Empresa','Situação','Validade','Clientes','Cadastro','Ações'].map(h=><th key={h} className="px-3 py-3 font-medium whitespace-nowrap">{h}</th>)}</tr></thead>
      <tbody>{shown.map(r=><tr key={r.id} className="border-t border-navy-700 hover:bg-navy-900/60">
       <td className="px-3 py-3"><p className="font-semibold">{r.empresa}</p><p className="text-xs text-slate-400">{r.email}</p></td>
       <td className="px-3 py-3"><Badge r={r}/></td><td className="px-3 py-3 whitespace-nowrap">{ate(r)}</td>
       <td className="px-3 py-3">{r.total_clientes}</td><td className="px-3 py-3 whitespace-nowrap">{fmtD(r.created_at)}</td>
       <td className="px-3 py-3"><Acts r={r}/></td></tr>)}</tbody></table></div>
    <div className="md:hidden space-y-3">{shown.map(r=><div key={r.id} className="rounded-xl bg-navy-900 border border-navy-700 p-4 space-y-2">
     <div className="flex justify-between items-start gap-2"><div className="min-w-0"><p className="font-semibold truncate">{r.empresa}</p><p className="text-xs text-slate-400 truncate">{r.email}</p></div><Badge r={r}/></div>
     <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-sm"><span className="text-slate-400">Validade</span><span className="text-right">{ate(r)}</span>
      <span className="text-slate-400">Clientes</span><span className="text-right">{r.total_clientes}</span>
      <span className="text-slate-400">Cadastro</span><span className="text-right">{fmtD(r.created_at)}</span></div><Acts r={r}/></div>)}</div></>}
  </main>
  {modal?.type==='lib'&&<Modal title="Liberar 30 dias" onClose={()=>setModal(null)}>
   <p className="text-sm mb-1"><b>{modal.r.empresa}</b></p><p className="text-xs text-slate-400 mb-3">{modal.r.email}</p>
   <p className="text-sm text-slate-300 mb-4">Registra o pagamento de <b className="text-gold-300">R$ 21,00</b> e libera o acesso até <b className="text-gold-300">{fmt(novoAte(modal.r))}</b>.</p>
   <div className="flex gap-2"><button onClick={()=>setModal(null)} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button onClick={()=>act(()=>api.admin.liberar(modal.r.id))} className="flex-1 btn-gold rounded-lg py-2.5">Confirmar</button></div></Modal>}
  {modal?.type==='blq'&&<Modal title="Bloquear acesso" onClose={()=>setModal(null)}>
   <p className="text-sm mb-4">Bloquear <b>{modal.r.empresa}</b>? Ele continua vendo os dados, mas não consegue editar até você liberar de novo.</p>
   <div className="flex gap-2"><button onClick={()=>setModal(null)} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button onClick={()=>act(()=>api.admin.bloquear(modal.r.id))} className="flex-1 rounded-lg bg-red-600 py-2.5 font-semibold">Bloquear</button></div></Modal>}
 </div>);
}

function App(){
 const [user,setUser]=useState(null);const [ready,setReady]=useState(false);const [view,setView]=useState('clientes');
 useEffect(()=>{api.auth.session().then(setUser).catch(()=>{}).finally(()=>setReady(true))},[]);
 if(!ready)return <div className="min-h-screen flex items-center justify-center text-slate-400">Carregando…</div>;
 if(!user)return <Login onAuth={setUser}/>;
 const out=async()=>{await api.auth.signOut();setUser(null);setView('clientes')};
 const nav=user.isAdmin?<button onClick={()=>setView(view==='admin'?'clientes':'admin')} className="text-sm btn-gold rounded-lg px-3 py-1.5 mr-2">{view==='admin'?'Meus clientes':'👑 Assinantes'}</button>:null;
 return view==='admin'&&user.isAdmin?<AdminPanel user={user} onLogout={out} extra={nav}/>:<ClientsPanel title="Meus Clientes" user={user} onLogout={out} extra={nav}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
