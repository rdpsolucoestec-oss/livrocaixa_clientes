const fmt=s=>s?s.split('-').reverse().join('/'):'—';
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const today=()=>iso(0);
const statusOf=c=>(c.valor-c.pago<=0)?'quitado':(c.vencimento<today()?'atrasado':'em_dia');
const ST={quitado:['Quitado','bg-emerald-500/15 text-emerald-300'],atrasado:['Atrasado','bg-red-500/15 text-red-300'],em_dia:['Em dia','bg-gold-500/15 text-gold-300']};

/* ========== CAMADA DE DADOS (mock) ==========
   Para o Supabase, troque apenas o corpo de cada função:
   auth.signIn  -> supabase.auth.signInWithPassword({email,password})
   clients.list -> supabase.from('clientes').select('*').eq('owner_id', uid)
   clients.create/update/remove -> .insert() / .update().eq('id') / .delete().eq('id')
   Os componentes só falam com `api`, nunca com o banco. */
let DB=[
 {id:1,nome:'Maria Silva',contato:'(81) 99911-2233',dataInicial:iso(-60),vencimento:iso(-5),valor:450,pago:150,tipo:'Fixo'},
 {id:2,nome:'João Pereira',contato:'joao@email.com',dataInicial:iso(-30),vencimento:iso(12),valor:320,pago:100,tipo:'Variável'},
 {id:3,nome:'Loja Bela Vista',contato:'(81) 3333-4455',dataInicial:iso(-90),vencimento:iso(-20),valor:1200,pago:1200,tipo:'Fixo'},
 {id:4,nome:'Ana Costa',contato:'(87) 98877-6655',dataInicial:iso(-45),vencimento:iso(-2),valor:280,pago:0,tipo:'Variável'},
 {id:5,nome:'Carlos Mendes',contato:'carlos@email.com',dataInicial:iso(-10),vencimento:iso(20),valor:600,pago:200,tipo:'Fixo'},
 {id:6,nome:'Pedro Lima',contato:'(81) 99100-2020',dataInicial:iso(-75),vencimento:iso(-30),valor:90,pago:90,tipo:'Variável'}];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const api={
 auth:{
  async signIn(email,password){await wait(500);if(!email||password.length<4)throw new Error('E-mail ou senha inválidos.');return{email,nome:email.split('@')[0],trialEndsAt:iso(15)}},
  async signUp(nome,email,password){await wait(500);if(!nome||!email||password.length<6)throw new Error('Preencha todos os campos (senha com 6+ caracteres).');return{email,nome,trialEndsAt:iso(15)}}},
 clients:{
  async list(){await wait(200);return[...DB]},
  async create(c){const n={...c,id:Date.now()};DB=[n,...DB];return n},
  async update(id,c){DB=DB.map(x=>x.id===id?{...x,...c}:x)},
  async remove(id){DB=DB.filter(x=>x.id!==id)}}};

 <div class="top"><img src="${LOGO}" alt=""><h1>${empresa}</h1><small>Comprovante de ${pay?'Pagamento':'Débito'}</small></div>
 <table width="100%"><tr><td>Cliente</td><td class="v">${c.nome}</td></tr><tr><td>Contato</td><td class="v">${c.contato}</td></tr>
 <tr><td>Data inicial</td><td class="v">${fmt(c.dataInicial)}</td></tr><tr><td>Vencimento</td><td class="v">${fmt(c.vencimento)}</td></tr>
 <tr><td>Valor total</td><td class="v">${brl(c.valor)}</td></tr><tr><td>${pay?'Total pago':'Saldo em aberto'}</td><td class="v">${brl(val)}</td></tr></table>
 <p style="text-align:center;margin-top:30px;font-size:12px">Emitido em ${new Date().toLocaleString('pt-BR')}<br>Sistema Rina Soluções</p><script>window.print()<\/script></body></html>`);
 w.document.close();
}

/* ========== UI base ========== */
const inp='w-full rounded-lg bg-navy-950 border border-navy-700 px-3 py-2.5 text-sm focus:outline-none focus:border-gold-500';
const Field=({label,children})=><label className="block"><span className="text-xs text-slate-400 mb-1 block">{label}</span>{children}</label>;
const Modal=({title,onClose,children})=>(
 <div className="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
  <div className="bg-navy-900 border border-gold-600/40 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5" onClick={e=>e.stopPropagation()}>
   <div className="flex justify-between items-center mb-4"><h3 className="font-bold gold-text text-lg">{title}</h3><button onClick={onClose} className="text-slate-400 text-2xl leading-none">×</button></div>{children}</div></div>);

/* ========== Tela 1: Login / Cadastro / Termos ========== */
function Login({onAuth}){
 const [mode,setMode]=useState('login');const [f,setF]=useState({nome:'',email:'',senha:''});
 const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [terms,setTerms]=useState(false);const [ok,setOk]=useState(false);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const submit=async e=>{e.preventDefault();setErr('');
  if(mode==='signup'&&!ok){setErr('Aceite os Termos para continuar.');return}
  setBusy(true);try{onAuth(mode==='login'?await api.auth.signIn(f.email,f.senha):await api.auth.signUp(f.nome,f.email,f.senha))}catch(x){setErr(x.message)}setBusy(false)};
 return(
 <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-navy-900 to-navy-950">
  <div className="w-full max-w-md">
   <img src={LOGO} alt="Rina Soluções" className="w-40 h-40 sm:w-48 sm:h-48 object-contain mx-auto rounded-2xl"/>
   <div className="bg-navy-900/80 border border-gold-600/30 rounded-2xl p-6 mt-4 shadow-2xl">
    <div className="grid grid-cols-2 bg-navy-950 rounded-lg p-1 mb-5">
     {[['login','Entrar'],['signup','Criar conta']].map(([m,t])=><button key={m} onClick={()=>{setMode(m);setErr('')}} className={'py-2 rounded-md text-sm font-semibold '+(mode===m?'btn-gold':'text-slate-400')}>{t}</button>)}</div>
    {mode==='signup'&&<div className="mb-4 rounded-lg border border-gold-500/40 bg-gold-500/10 p-3 text-sm text-gold-300">🎁 <b>15 dias grátis</b>, depois apenas <b>R$ 21,00/mês</b>. Sem fidelidade.</div>}
    <form onSubmit={submit} className="space-y-3">
     {mode==='signup'&&<Field label="Nome / Empresa"><input className={inp} value={f.nome} onChange={set('nome')}/></Field>}
     <Field label="E-mail"><input type="email" className={inp} value={f.email} onChange={set('email')} autoComplete="email"/></Field>
     <Field label="Senha"><input type="password" className={inp} value={f.senha} onChange={set('senha')} autoComplete={mode==='login'?'current-password':'new-password'}/></Field>
     {mode==='signup'&&<label className="flex gap-2 text-xs text-slate-300"><input type="checkbox" checked={ok} onChange={e=>setOk(e.target.checked)} className="mt-0.5 accent-yellow-500"/><span>Li e aceito os <button type="button" onClick={()=>setTerms(true)} className="text-gold-400 underline">Termos de Responsabilidade e Privacidade</button>.</span></label>}
     {err&&<p className="text-red-400 text-sm">{err}</p>}
     <button disabled={busy} className="btn-gold w-full rounded-lg py-3 disabled:opacity-60">{busy?'Aguarde…':mode==='login'?'Entrar':'Começar teste grátis'}</button>
    </form>
    {mode==='login'&&<p className="text-center text-xs text-slate-400 mt-4">Demo: qualquer e-mail e senha com 4+ caracteres.</p>}
    <p className="text-center text-xs mt-3"><button onClick={()=>setTerms(true)} className="text-gold-400 underline">Termos de Responsabilidade e Privacidade</button></p>
   </div>
  </div>
  {terms&&<Modal title="Termos de Responsabilidade e Privacidade" onClose={()=>setTerms(false)}>
   <div className="text-sm text-slate-300 space-y-3">
    <p><b className="text-gold-300">1. Responsabilidade.</b> A plataforma é uma ferramenta de organização. Os dados dos seus clientes e a veracidade dos lançamentos são de sua responsabilidade.</p>
    <p><b className="text-gold-300">2. Privacidade (LGPD).</b> Os dados são usados apenas para operar o serviço e não são vendidos a terceiros.</p>
    <p><b className="text-gold-300">3. Plano.</b> 15 dias grátis; depois R$ 21,00/mês, com cancelamento a qualquer momento.</p>
    <p className="text-xs text-slate-500">Texto provisório — substituir pelo jurídico final.</p></div></Modal>}
 </div>);
}

/* ========== Tela 2: Dashboard (reutilizável p/ Tela 3) ========== */
const Stat=({label,value,sub,tone})=>(
 <div className="rounded-xl bg-navy-900 border border-navy-700 p-4"><p className="text-xs text-slate-400">{label}</p>
  <p className={'text-xl sm:text-2xl font-bold mt-1 '+(tone||'gold-text')}>{value}</p>{sub&&<p className="text-xs text-slate-500 mt-0.5">{sub}</p>}</div>);

const empty={nome:'',contato:'',dataInicial:iso(0),vencimento:iso(30),valor:'',pago:0,tipo:'Fixo'};
function ClientForm({initial,onSave,onClose}){
 const [f,setF]=useState(initial||empty);const set=k=>e=>setF({...f,[k]:e.target.value});
 const save=e=>{e.preventDefault();if(!f.nome||!f.valor)return;onSave({...f,valor:+f.valor,pago:+f.pago||0})};
 return(<form onSubmit={save} className="space-y-3">
  <Field label="Nome"><input className={inp} value={f.nome} onChange={set('nome')} required/></Field>
  <Field label="Dados de contato"><input className={inp} value={f.contato} onChange={set('contato')} placeholder="Telefone ou e-mail"/></Field>
  <div className="grid grid-cols-2 gap-3">
   <Field label="Data inicial"><input type="date" className={inp} value={f.dataInicial} onChange={set('dataInicial')}/></Field>
   <Field label="Vencimento"><input type="date" className={inp} value={f.vencimento} onChange={set('vencimento')}/></Field>
   <Field label="Valor (R$)"><input type="number" step="0.01" min="0" className={inp} value={f.valor} onChange={set('valor')} required/></Field>
   <Field label="Já pago (R$)"><input type="number" step="0.01" min="0" className={inp} value={f.pago} onChange={set('pago')}/></Field></div>
  <Field label="Tipo"><select className={inp} value={f.tipo} onChange={set('tipo')}><option>Fixo</option><option>Variável</option></select></Field>
  <div className="flex gap-2 pt-2"><button type="button" onClick={onClose} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button className="flex-1 btn-gold rounded-lg py-2.5">Salvar</button></div></form>);
}

function ClientsPanel({title,user,onLogout}){
 const [list,setList]=useState([]);const [loading,setLoading]=useState(true);
 const [q,setQ]=useState('');const [flt,setFlt]=useState('todos');const [modal,setModal]=useState(null);
 const load=async()=>{setList(await api.clients.list());setLoading(false)};
 useEffect(()=>{load()},[]);
 const stats=useMemo(()=>{
  const open=list.filter(c=>statusOf(c)!=='quitado'),late=list.filter(c=>statusOf(c)==='atrasado'),paid=list.filter(c=>statusOf(c)==='quitado');
  const sum=a=>a.reduce((s,c)=>s+(c.valor-c.pago),0);
  return{receber:sum(open),atrasados:sum(late),quitados:list.filter(c=>statusOf(c)==='quitado').reduce((s,c)=>s+c.valor,0),total:list.length,nLate:late.length}},[list]);
 const shown=list.filter(c=>(flt==='todos'||statusOf(c)===flt)&&c.nome.toLowerCase().includes(q.toLowerCase()));
 const save=async d=>{modal.client?await api.clients.update(modal.client.id,d):await api.clients.create(d);setModal(null);load()};
 const del=async()=>{await api.clients.remove(modal.client.id);setModal(null);load()};
 const Actions=({c})=>(<div className="flex flex-wrap gap-1.5">
  <button onClick={()=>setModal({type:'edit',client:c})} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">✏️ Editar</button>
  <button onClick={()=>printReceipt(c,'pagamento',user.nome)} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">🧾 Pagamento</button>
  <button onClick={()=>printReceipt(c,'debito',user.nome)} className="px-2.5 py-1.5 rounded-md bg-navy-700 text-xs">📄 Débito</button>
  <button onClick={()=>setModal({type:'del',client:c})} className="px-2.5 py-1.5 rounded-md bg-red-500/15 text-red-300 text-xs">🗑 Excluir</button></div>);
 const Badge=({c})=>{const[t,cl]=ST[statusOf(c)];return<span className={'px-2 py-0.5 rounded-full text-xs font-semibold '+cl}>{t}</span>};
 return(
 <div className="min-h-screen bg-navy-950">
  <header className="sticky top-0 z-30 bg-navy-900/95 backdrop-blur border-b border-gold-600/30">
   <div className="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-3">
    <img src={LOGO} alt="" className="w-10 h-10 rounded-lg object-cover"/>
    <div className="flex-1 min-w-0"><p className="font-bold gold-text leading-tight truncate">Rina Soluções</p><p className="text-xs text-slate-400 truncate">{user.nome} · teste até {fmt(user.trialEndsAt)}</p></div>
    <button onClick={onLogout} className="text-sm text-slate-300 border border-navy-700 rounded-lg px-3 py-1.5">Sair</button></div></header>
  <main className="max-w-6xl mx-auto p-4 space-y-5">
   <div className="flex items-center justify-between gap-3"><h1 className="text-xl font-bold">{title}</h1>
    <button onClick={()=>setModal({type:'edit'})} className="btn-gold rounded-lg px-4 py-2 text-sm">+ Novo Cliente</button></div>
   <section className="grid grid-cols-2 lg:grid-cols-5 gap-3">
    <Stat label="Total a Receber" value={brl(stats.receber)}/>
    <Stat label="Soma dos Atrasados" value={brl(stats.atrasados)} tone="text-red-300"/>
    <Stat label="Soma dos Quitados" value={brl(stats.quitados)} tone="text-emerald-300"/>
    <Stat label="Total de Clientes" value={stats.total}/>
    <Stat label="Clientes Atrasados" value={`${stats.nLate} / ${stats.total}`} sub="atrasados / total" tone="text-red-300"/></section>
   <div className="flex flex-col sm:flex-row gap-2">
    <input className={inp+' sm:max-w-xs'} placeholder="🔍 Buscar cliente…" value={q} onChange={e=>setQ(e.target.value)}/>
    <div className="flex gap-1.5 overflow-x-auto">{[['todos','Todos'],['em_dia','Em dia'],['atrasado','Atrasados'],['quitado','Quitados']].map(([k,t])=>
     <button key={k} onClick={()=>setFlt(k)} className={'px-3 py-2 rounded-lg text-sm whitespace-nowrap '+(flt===k?'btn-gold':'bg-navy-900 text-slate-300 border border-navy-700')}>{t}</button>)}</div></div>
   {loading?<p className="text-slate-400">Carregando…</p>:shown.length===0?<p className="text-slate-400 text-center py-10">Nenhum cliente encontrado.</p>:<>
    <div className="hidden md:block rounded-xl border border-navy-700 overflow-x-auto">
     <table className="w-full text-sm"><thead className="bg-navy-900 text-slate-400 text-left"><tr>{['Cliente','Início','Vencimento','Valor','Pago','Saldo','Tipo','Status','Ações'].map(h=><th key={h} className="px-3 py-3 font-medium whitespace-nowrap">{h}</th>)}</tr></thead>
      <tbody>{shown.map(c=><tr key={c.id} className="border-t border-navy-700 hover:bg-navy-900/60">
       <td className="px-3 py-3"><p className="font-semibold">{c.nome}</p><p className="text-xs text-slate-400">{c.contato}</p></td>
       <td className="px-3 py-3 whitespace-nowrap">{fmt(c.dataInicial)}</td><td className="px-3 py-3 whitespace-nowrap">{fmt(c.vencimento)}</td>
       <td className="px-3 py-3 whitespace-nowrap">{brl(c.valor)}</td><td className="px-3 py-3 whitespace-nowrap">{brl(c.pago)}</td>
       <td className="px-3 py-3 whitespace-nowrap font-semibold text-gold-300">{brl(c.valor-c.pago)}</td><td className="px-3 py-3">{c.tipo}</td>
       <td className="px-3 py-3"><Badge c={c}/></td><td className="px-3 py-3"><Actions c={c}/></td></tr>)}</tbody></table></div>
    <div className="md:hidden space-y-3">{shown.map(c=><div key={c.id} className="rounded-xl bg-navy-900 border border-navy-700 p-4 space-y-2">
     <div className="flex justify-between items-start gap-2"><div><p className="font-semibold">{c.nome}</p><p className="text-xs text-slate-400">{c.contato}</p></div><Badge c={c}/></div>
     <div className="grid grid-cols-2 gap-x-3 gap-y-1 text-sm">
      <span className="text-slate-400">Início</span><span className="text-right">{fmt(c.dataInicial)}</span>
      <span className="text-slate-400">Vencimento</span><span className="text-right">{fmt(c.vencimento)}</span>
      <span className="text-slate-400">Valor</span><span className="text-right">{brl(c.valor)}</span>
      <span className="text-slate-400">Pago</span><span className="text-right">{brl(c.pago)}</span>
      <span className="text-slate-400">Saldo</span><span className="text-right font-bold text-gold-300">{brl(c.valor-c.pago)}</span>
      <span className="text-slate-400">Tipo</span><span className="text-right">{c.tipo}</span></div><Actions c={c}/></div>)}</div></>}
  </main>
  {modal?.type==='edit'&&<Modal title={modal.client?'Editar Cliente':'Novo Cliente'} onClose={()=>setModal(null)}><ClientForm initial={modal.client} onSave={save} onClose={()=>setModal(null)}/></Modal>}
  {modal?.type==='del'&&<Modal title="Excluir cliente" onClose={()=>setModal(null)}><p className="text-sm mb-4">Excluir <b>{modal.client.nome}</b>? Esta ação não pode ser desfeita.</p>
   <div className="flex gap-2"><button onClick={()=>setModal(null)} className="flex-1 rounded-lg border border-navy-700 py-2.5">Cancelar</button><button onClick={del} className="flex-1 rounded-lg bg-red-600 py-2.5 font-semibold">Excluir</button></div></Modal>}
 </div>);
}

function App(){
 const [user,setUser]=useState(null);
 return user?<ClientsPanel title="Meus Clientes" user={user} onLogout={()=>setUser(null)}/>:<Login onAuth={setUser}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
